services:
  db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_USER: ${DATABASE_USERNAME}
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME} -d ${DATABASE_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - FOWNER
      - CHOWN
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=db"

  admin:
    image: dpage/pgadmin4
    container_name: 69-s3-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/misc/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
      - /var/log/pgadmin
      - /var/run/pgadmin
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=admin"

  app:
    image: prawee/strapi
    container_name: 69-s3-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:9093:1337"
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: db
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USERNAME: ${DATABASE_USERNAME}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: "false"
      JWT_SECRET: ${STRAPI_JWT_SECRET}
      ADMIN_JWT_SECRET: ${STRAPI_JWT_SECRET}
      API_TOKEN_SALT: ${STRAPI_JWT_SECRET}
      JWT_EXPIRES_IN: "15m"
      TRANSFER_TOKEN_SALT: ${STRAPI_JWT_SECRET}
    volumes:
      - ./strapi-config/middlewares.js:/opt/app/config/middlewares.js:ro
      - ./strapi-config/plugins.js:/opt/app/config/plugins.js:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:1337/_health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
      - /opt/app/.tmp
      - /opt/app/public/uploads
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        labels: "service=app"

volumes:
  data:
    driver: local

networks:
  internal:
    driver: bridge
    internal: true
