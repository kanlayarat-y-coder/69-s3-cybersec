services:
db:
    image: postgres:16-alpine
    container_name: 69-s3-db
    ports:
      - "8083:80"
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}           
    image: dpage/pgadmin4
    container_name: 69-s3-admin
    ports:
      - "8083:80"
    env_file:
      - ./admin/.env           

app:
    image: prawee/strapi
    container_name: 69-s3-app
    ports:
      - "8083:80"
    env_file:
      - ./app/.env             
    environment:
      - DATABASE_CLIENT=postgres
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_SSL=false
    depends_on:
      - db