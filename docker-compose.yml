services:
  db:
    image: postgres:15-alpine
    container_name: 69-s3-db
    restart: always
    env_file:
      - ./db/.env
    ports:
      - "54327:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  admin:
    image: dpage/pgadmin4
    container_name: 69-s3-admin
    restart: always
    env_file:
      - ./admin/.env
    ports:
      - "8083:80"
    depends_on:
      - db

  app:
    image: prawee/strapi:latest
    container_name: 69-s3-app
    restart: always
    ports:
      - "9093:1337"
    environment:
      DATABASE_CLIENT: ${DATABASE_CLIENT}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT}
      DATABASE_NAME: ${DATABASE_DB}
      DATABASE_USERNAME: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSL: ${DATABASE_SSL}
    depends_on:
      - db

volumes:
  db_data: